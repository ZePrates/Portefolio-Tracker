name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, type-check e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Verificação de tipos
        run: bunx tsc --noEmit

      - name: Testes
        run: bun run test

      - name: Auditoria de dependências (informativa)
        # Não bloqueia: a única vulnerabilidade restante (30/10/2026) é o zod 3,
        # cuja correção só existe no zod 4 (migração maior). Ver docs/AUDITORIA-2026-10-30.md.
        continue-on-error: true
        run: bun audit
